services:
  api:
    build: ./backend
    environment:
      DB_PATH: /data/paradigms.db
    volumes:
      - backend_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    environment:
      FRONTEND_LOCAL_API_BASE_URL: ${FRONTEND_LOCAL_API_BASE_URL:-}
      FRONTEND_LOCAL_BACKEND_LABEL: ${FRONTEND_LOCAL_BACKEND_LABEL:-Local Docker backend}
      FRONTEND_REMOTE_API_BASE_URL: ${FRONTEND_REMOTE_API_BASE_URL:-https://yalla-balagan.fastapicloud.dev}
      FRONTEND_REMOTE_BACKEND_LABEL: ${FRONTEND_REMOTE_BACKEND_LABEL:-FastAPI Cloud backend}
      FRONTEND_DEFAULT_BACKEND_KEY: ${FRONTEND_DEFAULT_BACKEND_KEY:-local}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80"

volumes:
  backend_data:
